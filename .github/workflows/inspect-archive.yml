# Checks the block seams of a finished Map Tiles run: compares tiles along block borders in the
# merged archive (artifact europe-archive) with the block archives (artifacts part-*).
# Read only: nothing goes to the storage zone.
name: Inspect Archive

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id of the Map Tiles run'
        type: string
        required: true
      points:
        description: 'lon lat;lon lat;... along block borders'
        type: string
        default: '7.80 48.57;7.60 47.56;7.50 43.78;12.10 50.20;13.00 47.80;14.70 50.90;16.95 48.10;6.10 50.80;2.60 51.07;9.40 54.80'
      zooms:
        type: string
        default: '6,8,10,12,14'

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/lib/jvm
          sudo mkdir -p /mnt/aa && sudo chown "$USER" /mnt/aa
          python3 -m pip install --user --quiet pmtiles==3.4.1
          df -h /
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: /mnt/aa
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Inspect seams
        env:
          POINTS: ${{ inputs.points }}
          ZOOMS: ${{ inputs.zooms }}
        run: |
          ls -lh /mnt/aa
          python3 inspect-tiles.py "$POINTS" "$ZOOMS" /mnt/aa/europe.pmtiles /mnt/aa/de.pmtiles /mnt/aa/fr.pmtiles \
            /mnt/aa/alpen-adria.pmtiles /mnt/aa/ost.pmtiles /mnt/aa/nordwest.pmtiles | tee /tmp/seams.txt
          { echo '```'; cat /tmp/seams.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
