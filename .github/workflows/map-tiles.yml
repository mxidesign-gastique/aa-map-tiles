# Basemap build for map.all-active.net: Geofabrik extracts -> Planetiler -> one PMTiles archive
# -> Bunny storage zone allactive-tiles-ssd.
#
# This repository is public on purpose: GitHub gives public repositories 4 CPU / 16 GB RAM
# runners, private ones 2 CPU / 8 GB. With 8 GB the node location table (13 GB for DE, AT, CH,
# LI, IT) does not fit the page cache and Planetiler crawled at ~3k ways/s (06.11.2026).
# Nothing secret lives here: the zone password is the repository secret TILES_S3_SECRET_ACCESS_KEY,
# which only reaches the steps that talk to the zone. The workflow runs on manual dispatch only,
# so forks and pull requests never see the secret.
#
# The archive goes to a NEW key; the live map keeps reading its archive until ARCHIVE_PATH of the
# edge script allactive-tiles is switched (docs/karte-kachel-origin.md in the main repository).
name: Map Tiles

on:
  workflow_dispatch:
    inputs:
      regions:
        description: 'Geofabrik paths, space separated'
        type: string
        default: 'europe/germany europe/austria europe/switzerland europe/liechtenstein europe/italy'
      bounds:
        description: 'minLon,minLat,maxLon,maxLat of the tiles; must cover the regions'
        type: string
        default: '5.5,35.2,19.0,55.2'
      archive_key:
        description: 'Target key in the zone, tiles/europe-<suffix>.pmtiles; empty = tiles/europe-<YYYYMMDD>.pmtiles'
        type: string
        default: ''
      water_url:
        description: 'Source of water-polygons-split-3857.zip; empty = osmdata.openstreetmap.de (e.g. a Wayback Machine id_ URL while it is down)'
        type: string
        default: ''
      upload:
        description: 'Upload the archive to allactive-tiles-ssd (false = build and verify only)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: map-tiles
  cancel-in-progress: false

env:
  ZONE: allactive-tiles-ssd
  S3_ENDPOINT: https://de-s3.storage.bunnycdn.com
  LIVE_KEY: tiles/europe.pmtiles
  PMTILES_VERSION: 1.31.2
  PMTILES_SHA256: 3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f

jobs:
  build:
    name: build basemap archive
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      REGIONS: ${{ inputs.regions }}
      BOUNDS: ${{ inputs.bounds }}
      ARCHIVE_KEY_INPUT: ${{ inputs.archive_key }}
      UPLOAD: ${{ inputs.upload }}
      AWS_DEFAULT_REGION: de
      WORK_DIR: ${{ github.workspace }}/../aa-tiles
      # Copy of the water polygons in the zone; under tiles/ so the edge script never serves it.
      WATER_MIRROR_KEY: tiles/sources/water-polygons-split-3857.zip
    steps:
      - uses: actions/checkout@v4

      - name: Check target key and credentials
        # The zone password only reaches the two steps that talk to the zone, never the build.
        env:
          AWS_ACCESS_KEY_ID: allactive-tiles-ssd
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TILES_S3_SECRET_ACCESS_KEY }}
        run: |
          key="${ARCHIVE_KEY_INPUT:-tiles/europe-$(date -u +%Y%m%d).pmtiles}"
          if [[ ! "$key" =~ ^tiles/europe-[a-z0-9-]+\.pmtiles$ ]] || [[ "$key" == "$LIVE_KEY" ]]; then
            echo "::error::archive_key must look like tiles/europe-<suffix>.pmtiles and never be $LIVE_KEY"
            exit 1
          fi
          echo "ARCHIVE_KEY=$key" >> "$GITHUB_ENV"
          if [[ "$UPLOAD" != "true" ]]; then
            echo "Upload off: build and verify only."
            exit 0
          fi
          if [[ -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::error::Secret TILES_S3_SECRET_ACCESS_KEY (password of the zone $ZONE) is missing"
            exit 1
          fi
          # Fail before hours of building, not after: wrong password or a taken key.
          aws s3api list-objects-v2 --bucket "$ZONE" --prefix tiles/ --max-items 1 --endpoint-url "$S3_ENDPOINT" >/dev/null
          if aws s3api head-object --bucket "$ZONE" --key "$key" --endpoint-url "$S3_ENDPOINT" >/dev/null 2>&1; then
            echo "::error::$key already exists in $ZONE; choose another archive_key"
            exit 1
          fi
          echo "Target: $ZONE/$key"

      - name: Free disk, add swap
        run: |
          # The whole tool cache goes too: setup-java installs into it afterwards.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
            /opt/microsoft /opt/google /opt/az /usr/lib/google-cloud-sdk /usr/share/miniconda \
            /usr/local/lib/node_modules /usr/local/share/vcpkg /usr/share/az_* /usr/lib/jvm
          sudo mkdir -p /opt/hostedtoolcache && sudo chown "$USER" /opt/hostedtoolcache
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          # Swap only as a cushion against the OOM killer; every GB of it is disk the build lacks.
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 4G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile >/dev/null && sudo swapon /swapfile
          sudo mkdir -p /mnt/aa-tiles && sudo chown "$USER" /mnt/aa-tiles
          nproc; free -h; df -h / /mnt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          java-package: jre

      - name: Install osmium and pmtiles
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -fsSL -o /tmp/pmtiles.tar.gz \
            "https://github.com/protomaps/go-pmtiles/releases/download/v$PMTILES_VERSION/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz"
          echo "$PMTILES_SHA256  /tmp/pmtiles.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/bin" && tar -xzf /tmp/pmtiles.tar.gz -C "$HOME/bin" pmtiles
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Fetch water polygons
        # osmdata.openstreetmap.de is the only publisher and was down for hours on 05.11.2026. Every
        # successful fetch refreshes the copy in the zone; when the host is down the build takes that copy.
        env:
          AWS_ACCESS_KEY_ID: allactive-tiles-ssd
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TILES_S3_SECRET_ACCESS_KEY }}
          WATER_URL: ${{ inputs.water_url }}
        run: |
          dest="$WORK_DIR/data/sources/water-polygons-split-3857.zip"
          mkdir -p "$(dirname "$dest")"
          url="${WATER_URL:-https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip}"
          echo "Water polygons from $url"
          if curl -fsSL --retry 3 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o "$dest.part" \
              "$url" && unzip -tq "$dest.part" >/dev/null; then
            mv "$dest.part" "$dest"
            if [[ -n "$AWS_SECRET_ACCESS_KEY" ]]; then
              aws s3 cp "$dest" "s3://$ZONE/$WATER_MIRROR_KEY" --endpoint-url "$S3_ENDPOINT" --no-progress \
                || echo "::warning::could not refresh the water polygon copy in $ZONE"
            fi
          else
            rm -f "$dest.part"
            echo "::warning::osmdata.openstreetmap.de unreachable, using the copy in $ZONE/$WATER_MIRROR_KEY"
            aws s3 cp "s3://$ZONE/$WATER_MIRROR_KEY" "$dest" --endpoint-url "$S3_ENDPOINT" --no-progress
            unzip -tq "$dest" >/dev/null
          fi
          ls -lh "$dest"

      - name: Build archive
        env:
          # /mnt is the local temp disk where the runner has one, else part of the root disk.
          TMP_DIR: /mnt/aa-tiles/tmp
          OUTPUT: /mnt/aa-tiles/europe.pmtiles
          PLANETILER_HEAP: 4g
          DELETE_SOURCES: '1'
        run: |
          # Memory and disk every 5 minutes, so a stalled or killed run shows why.
          ( while sleep 300; do echo "--- $(date -u +%H:%M) $(free -m | awk '/Mem:/{print "mem used "$3"/"$2" MB"} /Swap:/{print "swap "$3" MB"}' | tr '\n' ' ')"; df -h / /mnt | tail -n +2; done ) &
          monitor=$!
          bash generate-tiles.sh
          kill "$monitor" || true

      - name: Verify archive
        env:
          ARCHIVE: /mnt/aa-tiles/europe.pmtiles
        run: |
          pmtiles show "$ARCHIVE"
          # One z10 tile per place inside BOUNDS must hold data (an empty tile means the region is missing).
          IFS=, read -r W S E N <<< "$BOUNDS"
          failed=0
          while read -r place lon lat; do
            inside=$(python3 -c "print(int($W <= $lon <= $E and $S <= $lat <= $N))" </dev/null)
            [[ "$inside" == "1" ]] || continue
            read -r x y < <(python3 -c "import math; z=10; n=2**z; r=math.radians($lat); print(int(($lon+180)/360*n), int((1-math.asinh(math.tan(r))/math.pi)/2*n))")
            bytes=$(pmtiles tile "$ARCHIVE" 10 "$x" "$y" </dev/null 2>/dev/null | wc -c)
            echo "$place 10/$x/$y: $bytes bytes"
            if [[ "$bytes" -lt 5000 ]]; then failed=1; echo "::error::$place has no map data (10/$x/$y)"; fi
          done <<'EOF'
          Munich 11.58 48.14
          Hamburg 9.99 53.55
          Vienna 16.37 48.21
          Innsbruck 11.40 47.27
          Zurich 8.54 47.37
          Geneva 6.14 46.20
          Lugano 8.95 46.00
          Vaduz 9.52 47.14
          Bolzano 11.35 46.50
          Milan 9.19 45.46
          Rome 12.50 41.90
          Naples 14.27 40.85
          Bari 16.87 41.12
          Palermo 13.36 38.12
          Cagliari 9.11 39.22
          EOF
          exit "$failed"

      - name: Upload to Bunny storage
        if: inputs.upload
        env:
          AWS_ACCESS_KEY_ID: allactive-tiles-ssd
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TILES_S3_SECRET_ACCESS_KEY }}
          ARCHIVE: /mnt/aa-tiles/europe.pmtiles
        run: |
          aws configure set default.s3.multipart_chunksize 64MB
          aws s3 cp "$ARCHIVE" "s3://$ZONE/$ARCHIVE_KEY" --endpoint-url "$S3_ENDPOINT" \
            --content-type application/vnd.pmtiles --no-progress
          remote=$(aws s3api head-object --bucket "$ZONE" --key "$ARCHIVE_KEY" --endpoint-url "$S3_ENDPOINT" --query ContentLength --output text)
          local_size=$(stat -c %s "$ARCHIVE")
          echo "local $local_size, remote $remote"
          [[ "$remote" == "$local_size" ]]

      - name: Summary
        if: always()
        env:
          ARCHIVE: /mnt/aa-tiles/europe.pmtiles
        run: |
          {
            echo "## Basemap archive"
            echo "- Regions: \`$REGIONS\`"
            echo "- Bounds: \`$BOUNDS\`"
            [[ -f "$ARCHIVE" ]] && echo "- Size: $(du -h "$ARCHIVE" | cut -f1)"
            if [[ "$UPLOAD" == "true" ]]; then
              echo "- Uploaded to \`$ZONE/$ARCHIVE_KEY\` (not live yet)"
              echo ""
              echo "Live schalten: Edge Script \`allactive-tiles\` → Umgebung \`ARCHIVE_PATH=$ARCHIVE_KEY\`, Pull Zone 6697032 purgen (docs/karte-kachel-origin.md im Hauptrepo)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
