# Basemap build for map.all-active.net: Geofabrik extracts -> Planetiler -> PMTiles, per block of
# countries -> one merged archive -> Bunny storage zone allactive-tiles-ssd.
#
# This repository is public on purpose: GitHub gives public repositories 4 CPU / 16 GB RAM
# runners, private ones 2 CPU / 8 GB. With 8 GB the node location table (13 GB for DE, AT, CH,
# LI, IT) does not fit the page cache and Planetiler crawled at ~3k ways/s (06.11.2026).
#
# All of Europe (35 GB PBF, a node table of ~50 GB) does not fit one 16 GB runner either, so
# blocks.json splits it into blocks of at most ~5 GB PBF. Every block runs as its own job in
# parallel; the merge job joins the block archives with merge-archives.py (tiles along block
# borders are merged feature by feature, features both extracts carry are kept once).
#
# Nothing secret lives here: the zone password is the repository secret TILES_S3_SECRET_ACCESS_KEY,
# which only reaches the steps that talk to the zone. The workflow runs on manual dispatch only,
# so forks and pull requests never see the secret.
#
# The archive goes to a NEW key; the live map keeps reading its archive until ARCHIVE_PATH of the
# edge script allactive-tiles is switched (docs/karte-kachel-origin.md in the main repository).
# With upload=false the merged archive stays a workflow artifact (7 days); publish-archive.yml
# copies it to the zone later without building again.
name: Map Tiles

on:
  workflow_dispatch:
    inputs:
      blocks:
        description: 'Blocks from blocks.json, space separated, or "all"'
        type: string
        default: 'all'
      archive_key:
        description: 'Target key in the zone, tiles/europe-<suffix>.pmtiles; empty = tiles/europe-<YYYYMMDD>.pmtiles'
        type: string
        default: ''
      water_url:
        description: 'Source of water-polygons-split-3857.zip; empty = osmdata.openstreetmap.de (e.g. a Wayback Machine id_ URL while it is down)'
        type: string
        default: ''
      upload:
        description: 'Upload the merged archive to allactive-tiles-ssd (false = keep it as a workflow artifact)'
        type: boolean
        default: false
      reuse_run:
        description: 'Run id whose block archives (part-*, 7 days) the merge takes for every block not built in this run; empty = none'
        type: string
        default: ''
      make_live:
        description: 'After the upload, point tiles/current.json at the new archive (the edge script follows it) and delete archives older than the last three'
        type: boolean
        default: false
      reuse_run2:
        description: 'Second earlier run id (its part-* win over reuse_run); empty = none'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: map-tiles
  cancel-in-progress: false

env:
  ZONE: allactive-tiles-ssd
  S3_ENDPOINT: https://de-s3.storage.bunnycdn.com
  LIVE_KEY: tiles/europe.pmtiles
  PMTILES_VERSION: 1.31.2
  PMTILES_SHA256: 3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f
  # Copy of the water polygons in the zone; under tiles/ so the edge script never serves it.
  WATER_MIRROR_KEY: tiles/sources/water-polygons-split-3857.zip
  AWS_DEFAULT_REGION: de

jobs:
  prepare:
    name: plan blocks, check target
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.blocks.outputs.matrix }}
      archive_key: ${{ steps.key.outputs.archive_key }}
    steps:
      - uses: actions/checkout@v4

      - name: Select blocks
        id: blocks
        env:
          BLOCKS: ${{ inputs.blocks }}
        run: |
          matrix=$(python3 - <<'EOF'
          import json, os
          blocks = json.load(open("blocks.json"))
          wanted = os.environ["BLOCKS"].split()
          if wanted and wanted != ["all"]:
              unknown = set(wanted) - {b["block"] for b in blocks}
              if unknown:
                  raise SystemExit(f"unknown blocks: {sorted(unknown)}")
              blocks = [b for b in blocks if b["block"] in wanted]
          print(json.dumps({"include": blocks}))
          EOF
          )
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | python3 -m json.tool

      - name: Check target key and credentials
        id: key
        # The zone password only reaches the steps that talk to the zone, never the build.
        env:
          AWS_ACCESS_KEY_ID: allactive-tiles-ssd
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TILES_S3_SECRET_ACCESS_KEY }}
          ARCHIVE_KEY_INPUT: ${{ inputs.archive_key }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          key="${ARCHIVE_KEY_INPUT:-tiles/europe-$(date -u +%Y%m%d).pmtiles}"
          if [[ ! "$key" =~ ^tiles/europe-[a-z0-9-]+\.pmtiles$ ]] || [[ "$key" == "$LIVE_KEY" ]]; then
            echo "::error::archive_key must look like tiles/europe-<suffix>.pmtiles and never be $LIVE_KEY"
            exit 1
          fi
          echo "archive_key=$key" >> "$GITHUB_OUTPUT"
          if [[ "$UPLOAD" != "true" ]]; then
            echo "Upload off: the merged archive stays a workflow artifact."
            exit 0
          fi
          if [[ -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::error::Secret TILES_S3_SECRET_ACCESS_KEY (password of the zone $ZONE) is missing"
            exit 1
          fi
          # Fail before hours of building, not after: wrong password or a taken key.
          aws s3api list-objects-v2 --bucket "$ZONE" --prefix tiles/ --max-items 1 --endpoint-url "$S3_ENDPOINT" >/dev/null
          if aws s3api head-object --bucket "$ZONE" --key "$key" --endpoint-url "$S3_ENDPOINT" >/dev/null 2>&1; then
            echo "::error::$key already exists in $ZONE; choose another archive_key"
            exit 1
          fi
          echo "Target: $ZONE/$key"

  build:
    name: build ${{ matrix.block }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      REGIONS: ${{ matrix.regions }}
      BOUNDS: ${{ matrix.bounds }}
      WORK_DIR: ${{ github.workspace }}/../aa-tiles
      ARCHIVE: /mnt/aa-tiles/${{ matrix.block }}.pmtiles
    steps:
      - uses: actions/checkout@v4

      - name: Free disk, add swap
        run: |
          # The whole tool cache goes too: setup-java installs into it afterwards.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
            /opt/microsoft /opt/google /opt/az /usr/lib/google-cloud-sdk /usr/share/miniconda \
            /usr/local/lib/node_modules /usr/local/share/vcpkg /usr/share/az_* /usr/lib/jvm
          sudo mkdir -p /opt/hostedtoolcache && sudo chown "$USER" /opt/hostedtoolcache
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          # Swap only as a cushion against the OOM killer; every GB of it is disk the build lacks.
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 4G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile >/dev/null && sudo swapon /swapfile
          sudo mkdir -p /mnt/aa-tiles && sudo chown "$USER" /mnt/aa-tiles
          nproc; free -h; df -h / /mnt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          java-package: jre

      - name: Install osmium and pmtiles
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -fsSL -o /tmp/pmtiles.tar.gz \
            "https://github.com/protomaps/go-pmtiles/releases/download/v$PMTILES_VERSION/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz"
          echo "$PMTILES_SHA256  /tmp/pmtiles.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/bin" && tar -xzf /tmp/pmtiles.tar.gz -C "$HOME/bin" pmtiles
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Fetch water polygons
        # osmdata.openstreetmap.de is the only publisher and was down for hours on 05.11.2026. When
        # the host is down the build takes the copy in the zone (read only). Only a run that uploads
        # refreshes that copy.
        env:
          AWS_ACCESS_KEY_ID: allactive-tiles-ssd
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TILES_S3_SECRET_ACCESS_KEY }}
          WATER_URL: ${{ inputs.water_url }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          dest="$WORK_DIR/data/sources/water-polygons-split-3857.zip"
          mkdir -p "$(dirname "$dest")"
          url="${WATER_URL:-https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip}"
          echo "Water polygons from $url"
          if curl -fsSL --retry 3 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o "$dest.part" \
              "$url" && unzip -tq "$dest.part" >/dev/null; then
            mv "$dest.part" "$dest"
            if [[ "$UPLOAD" == "true" && -n "$AWS_SECRET_ACCESS_KEY" && "${{ matrix.block }}" == "de" ]]; then
              aws s3 cp "$dest" "s3://$ZONE/$WATER_MIRROR_KEY" --endpoint-url "$S3_ENDPOINT" --no-progress \
                || echo "::warning::could not refresh the water polygon copy in $ZONE"
            fi
          else
            rm -f "$dest.part"
            echo "::warning::osmdata.openstreetmap.de unreachable, using the copy in $ZONE/$WATER_MIRROR_KEY"
            aws s3 cp "s3://$ZONE/$WATER_MIRROR_KEY" "$dest" --endpoint-url "$S3_ENDPOINT" --no-progress
            unzip -tq "$dest" >/dev/null
          fi
          ls -lh "$dest"

      - name: Build archive
        env:
          # /mnt is the local temp disk where the runner has one, else part of the root disk.
          TMP_DIR: /mnt/aa-tiles/tmp
          OUTPUT: ${{ env.ARCHIVE }}
          PLANETILER_HEAP: 4g
          DELETE_SOURCES: '1'
        run: |
          # Memory and disk every 5 minutes, so a stalled or killed run shows why.
          ( while sleep 300; do echo "--- $(date -u +%H:%M) $(free -m | awk '/Mem:/{print "mem used "$3"/"$2" MB"} /Swap:/{print "swap "$3" MB"}' | tr '\n' ' ')"; df -h / /mnt | tail -n +2; done ) &
          monitor=$!
          bash generate-tiles.sh
          kill "$monitor" || true

      - name: Verify archive
        run: |
          pmtiles show "$ARCHIVE"
          bash verify-archive.sh "$ARCHIVE" "${{ matrix.places }}"

      - name: Keep block archive
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.block }}
          path: ${{ env.ARCHIVE }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  merge:
    name: merge blocks
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      ARCHIVE: /mnt/aa-tiles/europe.pmtiles
      ARCHIVE_KEY: ${{ needs.prepare.outputs.archive_key }}
      UPLOAD: ${{ inputs.upload }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
            /opt/microsoft /opt/google /opt/az /usr/lib/google-cloud-sdk /usr/share/miniconda \
            /usr/local/lib/node_modules /usr/local/share/vcpkg /usr/lib/jvm
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          sudo mkdir -p /mnt/aa-tiles/parts /mnt/aa-tiles/tmp && sudo chown -R "$USER" /mnt/aa-tiles
          free -h; df -h / /mnt

      - name: Install pmtiles
        run: |
          python3 -m pip install --user --quiet pmtiles==3.4.1
          curl -fsSL -o /tmp/pmtiles.tar.gz \
            "https://github.com/protomaps/go-pmtiles/releases/download/v$PMTILES_VERSION/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz"
          echo "$PMTILES_SHA256  /tmp/pmtiles.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/bin" && tar -xzf /tmp/pmtiles.tar.gz -C "$HOME/bin" pmtiles
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Check reuse_run
        if: inputs.reuse_run != ''
        env:
          REUSE_RUN: ${{ inputs.reuse_run }}
          REUSE_RUN2: ${{ inputs.reuse_run2 }}
        run: |
          [[ "$REUSE_RUN" =~ ^[0-9]+$ ]] || { echo "::error::reuse_run must be a run id"; exit 1; }
          [[ -z "$REUSE_RUN2" || "$REUSE_RUN2" =~ ^[0-9]+$ ]] || { echo "::error::reuse_run2 must be a run id"; exit 1; }

      # Blocks of an earlier run first; the blocks built in this run overwrite theirs.
      - uses: actions/download-artifact@v4
        if: inputs.reuse_run != ''
        with:
          pattern: part-*
          path: /mnt/aa-tiles/parts
          merge-multiple: true
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        if: inputs.reuse_run != '' && inputs.reuse_run2 != ''
        with:
          pattern: part-*
          path: /mnt/aa-tiles/parts
          merge-multiple: true
          run-id: ${{ inputs.reuse_run2 }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: /mnt/aa-tiles/parts
          merge-multiple: true

      - name: Merge block archives
        env:
          # The writer keeps all tile data in a temporary file until it writes the archive.
          TMPDIR: /mnt/aa-tiles/tmp
        run: |
          ls -lh /mnt/aa-tiles/parts
          if [[ "${{ inputs.blocks }}" == "all" || -n "${{ inputs.reuse_run }}" ]]; then
            missing=$(python3 -c "import json, os; print(' '.join(b['block'] for b in json.load(open('blocks.json')) if not os.path.exists('/mnt/aa-tiles/parts/' + b['block'] + '.pmtiles')))")
            if [[ -n "$missing" ]]; then echo "::error::block archives missing: $missing"; exit 1; fi
          fi
          # The places of every block in the merge, for the check below.
          python3 -c "import json, os; print(';'.join(b['places'] for b in json.load(open('blocks.json')) if os.path.exists('/mnt/aa-tiles/parts/' + b['block'] + '.pmtiles')))" > /mnt/aa-tiles/places.txt
          ( while sleep 300; do echo "--- $(date -u +%H:%M) $(free -m | awk '/Mem:/{print "mem used "$3"/"$2" MB"}')"; df -h / | tail -n +2; done ) &
          monitor=$!
          python3 merge-archives.py "$ARCHIVE" /mnt/aa-tiles/parts/*.pmtiles
          kill "$monitor" || true
          rm -rf /mnt/aa-tiles/parts
          ls -lh "$ARCHIVE"

      - name: Verify archive
        run: |
          pmtiles show "$ARCHIVE"
          bash verify-archive.sh "$ARCHIVE" "$(cat /mnt/aa-tiles/places.txt)"

      - name: Keep merged archive
        if: inputs.upload == false
        uses: actions/upload-artifact@v4
        with:
          name: europe-archive
          path: ${{ env.ARCHIVE }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload to Bunny storage
        if: inputs.upload
        env:
          AWS_ACCESS_KEY_ID: allactive-tiles-ssd
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TILES_S3_SECRET_ACCESS_KEY }}
        run: |
          aws configure set default.s3.multipart_chunksize 64MB
          aws s3 cp "$ARCHIVE" "s3://$ZONE/$ARCHIVE_KEY" --endpoint-url "$S3_ENDPOINT" \
            --content-type application/vnd.pmtiles --no-progress
          remote=$(aws s3api head-object --bucket "$ZONE" --key "$ARCHIVE_KEY" --endpoint-url "$S3_ENDPOINT" --query ContentLength --output text)
          local_size=$(stat -c %s "$ARCHIVE")
          echo "local $local_size, remote $remote"
          [[ "$remote" == "$local_size" ]]

      # The edge script reads tiles/current.json (cached a few minutes) and falls back to its
      # ARCHIVE_PATH. A new archive goes live only if it is not much smaller than the live one.
      - name: Make live
        if: inputs.upload && inputs.make_live
        env:
          AWS_ACCESS_KEY_ID: allactive-tiles-ssd
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TILES_S3_SECRET_ACCESS_KEY }}
        run: |
          size=$(stat -c %s "$ARCHIVE")
          previous=""
          if aws s3 cp "s3://$ZONE/tiles/current.json" /tmp/current.json --endpoint-url "$S3_ENDPOINT" --no-progress 2>/dev/null; then
            previous=$(python3 -c "import json; print(json.load(open('/tmp/current.json'))['archive'])")
            previous_size=$(python3 -c "import json; print(json.load(open('/tmp/current.json'))['bytes'])")
            if (( size * 10 < previous_size * 9 )); then
              echo "::error::new archive ($size bytes) is more than 10% smaller than the live one ($previous_size); not switched"
              exit 1
            fi
          fi
          python3 -c "import json, sys; json.dump({'archive': sys.argv[1], 'bytes': int(sys.argv[2]), 'previous': sys.argv[3] or None, 'run': int(sys.argv[4]), 'built': sys.argv[5]}, open('/tmp/next.json', 'w'))" \
            "$ARCHIVE_KEY" "$size" "$previous" "${{ github.run_id }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          aws s3 cp /tmp/next.json "s3://$ZONE/tiles/current.json" --endpoint-url "$S3_ENDPOINT" \
            --content-type application/json --cache-control no-cache --no-progress
          cat /tmp/next.json
          # Old archives go only once the edge serves the new one (header x-archive).
          live=""
          for _ in $(seq 1 30); do
            live=$(python3 -c "import urllib.request; r = urllib.request.urlopen(urllib.request.Request('https://map.all-active.net/10/536/358.mvt?live-check=${{ github.run_id }}', headers={'User-Agent': 'aa-map-tiles'}), timeout=30); print(r.headers.get('x-archive', ''))" || true)
            [[ "$live" == "$ARCHIVE_KEY" ]] && break
            sleep 60
          done
          if [[ "$live" != "$ARCHIVE_KEY" ]]; then
            echo "::warning::the edge still serves '${live:-unknown}', not $ARCHIVE_KEY; old archives kept"
            exit 0
          fi
          keep=$(aws s3api list-objects-v2 --bucket "$ZONE" --prefix tiles/europe- --endpoint-url "$S3_ENDPOINT" \
            --query 'sort_by(Contents, &LastModified)[].Key' --output text | tr '\t' '\n' | grep -E '^tiles/europe-[a-z0-9-]+\.pmtiles$')
          echo "$keep" | head -n -3 | while read -r old; do
            [[ -z "$old" || "$old" == "$ARCHIVE_KEY" || "$old" == "$previous" ]] && continue
            echo "deleting $old"
            aws s3 rm "s3://$ZONE/$old" --endpoint-url "$S3_ENDPOINT"
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## Basemap archive"
            echo "- Blocks: \`${{ inputs.blocks }}\`, reused from runs: \`${{ inputs.reuse_run }} ${{ inputs.reuse_run2 }}\`"
            [[ -f /mnt/aa-tiles/places.txt ]] && echo "- Checked places: $(tr ';' '\n' < /mnt/aa-tiles/places.txt | wc -l)"
            [[ -f "$ARCHIVE" ]] && echo "- Size: $(du -h "$ARCHIVE" | cut -f1)"
            if [[ "$UPLOAD" == "true" ]]; then
              echo "- Uploaded to \`$ZONE/$ARCHIVE_KEY\` (live only with make_live)"
              echo ""
              echo "Von Hand live schalten: Edge Script \`allactive-tiles\` → Umgebung \`ARCHIVE_PATH=$ARCHIVE_KEY\`, Pull Zone 6697032 purgen (docs/karte-kachel-origin.md im Hauptrepo)."
            else
              echo "- Kept as artifact \`europe-archive\` of run ${{ github.run_id }} (7 days)."
              echo "- Hochladen ohne neuen Bau: Workflow *Publish Archive* mit run_id ${{ github.run_id }}."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
