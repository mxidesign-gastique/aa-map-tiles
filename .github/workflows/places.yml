# Builds the place list for search and the where-dialog (the main repo's
# backend/data/regions/dach-places.json.gz) from the public Overture divisions.
# Same script as backend/scripts/build_dach_places.py; the result is a workflow artifact only.
name: Places

on:
  workflow_dispatch:
    inputs:
      min_population:
        description: 'Smallest locality outside DE/AT/CH'
        type: string
        default: '1000'
      overture_release:
        description: 'Overture release; empty = the newest in the bucket'
        type: string
        default: ''
      countries:
        description: 'Countries to build (empty = all of the European basemap)'
        type: string
        default: ''
      upload:
        description: 'Put the list into allactive-tiles-ssd (places/current.json points at it; the backend picks it up)'
        type: boolean
        default: false
      full_countries:
        description: 'Countries taken complete, without the population limit'
        type: string
        default: ''

permissions:
  contents: read

env:
  ZONE: allactive-tiles-ssd
  S3_ENDPOINT: https://de-s3.storage.bunnycdn.com
  AWS_DEFAULT_REGION: de

jobs:
  places:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          MIN_POPULATION: ${{ inputs.min_population }}
          OVERTURE_RELEASE: ${{ inputs.overture_release }}
          PLACE_COUNTRIES_IN: ${{ inputs.countries }}
          FULL_COUNTRIES: ${{ inputs.full_countries }}
        run: |
          [[ "$MIN_POPULATION" =~ ^[0-9]+$ ]] || { echo "::error::min_population must be a number"; exit 1; }
          python3 -m pip install --user --quiet duckdb==1.4.1
          if [[ -n "$PLACE_COUNTRIES_IN" ]]; then export PLACE_COUNTRIES="$PLACE_COUNTRIES_IN"; fi
          /usr/bin/time -v -o /tmp/time.txt python3 places/build_places.py /tmp/places.json.gz | tee /tmp/stats.json
          grep -E 'Elapsed|Maximum resident' /tmp/time.txt
          ls -l /tmp/places.json.gz
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open('/tmp/stats.json'))
          print(f"## Places\n- {s['places']} places, min population {s['minPopulation']}, without parent {s['withoutParent']}\n")
          by = {}
          for k, v in s['byClass'].items():
              c, cl = k.split('/'); by.setdefault(c, {})[cl] = v
          print('| country | region | county | localadmin | locality |\n|---|---|---|---|---|')
          for c in sorted(by):
              d = by[c]; print(f"| {c} | {d.get('region',0)} | {d.get('county',0)} | {d.get('localadmin',0)} | {d.get('locality',0)} |")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: places
          path: /tmp/places.json.gz
          retention-days: 7
      - name: Upload to Bunny storage
        if: inputs.upload
        env:
          AWS_ACCESS_KEY_ID: allactive-tiles-ssd
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TILES_S3_SECRET_ACCESS_KEY }}
        run: |
          release=$(python3 -c "import json; print(json.load(open('/tmp/stats.json'))['release'])")
          count=$(python3 -c "import json; print(json.load(open('/tmp/stats.json'))['places'])")
          [[ "$count" -ge 50000 ]] || { echo "::error::only $count places; not published"; exit 1; }
          sha=$(sha256sum /tmp/places.json.gz | cut -d' ' -f1)
          key="places/europe-places-$release-${sha:0:12}.json.gz"
          aws s3 cp /tmp/places.json.gz "s3://$ZONE/$key" --endpoint-url "$S3_ENDPOINT" \
            --content-type application/gzip --no-progress
          python3 -c "import json, sys; json.dump({'release': sys.argv[1], 'path': sys.argv[2], 'sha256': sys.argv[3], 'places': int(sys.argv[4]), 'built': sys.argv[5]}, open('/tmp/current.json', 'w'))" \
            "$release" "/$key" "$sha" "$count" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          aws s3 cp /tmp/current.json "s3://$ZONE/places/current.json" --endpoint-url "$S3_ENDPOINT" \
            --content-type application/json --cache-control no-cache --no-progress
          cat /tmp/current.json
          echo "- Published \`$key\` ($count places), places/current.json points at it" >> "$GITHUB_STEP_SUMMARY"
