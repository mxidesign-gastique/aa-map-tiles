# Overlay tile set "routes" (route networks and graded ways) for map.all-active.net:
# Geofabrik extracts -> osmium (routes only) -> Planetiler profile in routes/ -> one PMTiles archive.
#
# Schema: README.md, section "routes (Wegenetze)". Layers route and way, zoom 6-14.
#
# Pilot area = Alps / Allgaeu: the single Geofabrik extract europe/alps (md5 checked) is filtered
# to route relations and graded ways and cut to the pilot box. Planetiler then only sees the
# few hundred MB of route relations, their member ways and nodes.
#
# The same filtered, cut file ($WORK/routes.osm.pbf) also feeds routes/export_relations.py, which writes
# the NOT public export routes.ndjson.gz (one line per hiking/foot relation, full geometry) for the
# backend tour import. Tile osm_id and export ref therefore always come from one source.
#
# Upload goes to routes/<YYYYMMDD>/routes.pmtiles and routes.ndjson.gz plus routes/current.json. This workflow never
# touches tiles/current.json (the basemap) and has no make-live step: the API reads routes/current.json.
#
# Manual dispatch only, so forks and pull requests never see the zone secret.
name: Routes Tiles

on:
  workflow_dispatch:
    inputs:
      area:
        description: 'Area to build. Only the pilot exists; Europe follows once the pilot was reviewed'
        type: choice
        options:
          - pilot
        default: pilot
      upload:
        description: 'Upload to allactive-tiles-ssd under routes/<YYYYMMDD>/ and update routes/current.json (false = artifacts only)'
        type: boolean
        default: false
      sample:
        description: 'Cut a small Oberstdorf sample (artifact routes-sample, 7 days)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: routes-tiles
  cancel-in-progress: false

env:
  ZONE: allactive-tiles-ssd
  S3_ENDPOINT: https://de-s3.storage.bunnycdn.com
  AWS_DEFAULT_REGION: de
  PMTILES_VERSION: 1.31.2
  PMTILES_SHA256: 3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f
  WORK: /mnt/aa-routes
  # Pilot: Alps / Allgaeu (min_lon,min_lat,max_lon,max_lat)
  PILOT_BBOX: '5.5,45.5,16.5,48.2'
  SAMPLE_BBOX: '10.15,47.30,10.45,47.48'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup 2>/dev/null || true
          sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"
          nproc; free -h; df -h / /mnt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          java-package: jdk
          cache: maven
          cache-dependency-path: routes/pom.xml

      - name: Install osmium and pmtiles
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          osmium --version | head -n 1
          curl -fsSL -o /tmp/pmtiles.tar.gz \
            "https://github.com/protomaps/go-pmtiles/releases/download/v$PMTILES_VERSION/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz"
          echo "$PMTILES_SHA256  /tmp/pmtiles.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/bin" && tar -xzf /tmp/pmtiles.tar.gz -C "$HOME/bin" pmtiles
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/pmtiles" version

      - name: Build the Planetiler profile
        run: |
          set -euo pipefail
          start=$SECONDS
          (cd routes && mvn -q -B package)
          jar=$(ls routes/target/*-with-deps.jar)
          echo "jar: $jar"
          echo "BUILD_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"
          echo "JAR=$PWD/$jar" >> "$GITHUB_ENV"

      # One Geofabrik extract for the whole Alps (alps.poly covers the pilot box, Allgaeu included),
      # so routes crossing a country border stay complete and nothing has to be merged.
      # tags-filter keeps referenced objects (member ways, their nodes, member relations) unless -R
      # is given, so -R stays off. trail_visibility alone does not qualify a way for the tile set,
      # so it is not part of the filter; it is read where a way is kept for another reason.
      - name: Download, check md5, filter
        run: |
          set -euo pipefail
          start=$SECONDS
          url=https://download.geofabrik.de/europe/alps-latest.osm.pbf
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -D "$WORK/alps.headers" -o "$WORK/alps.osm.pbf" "$url"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$WORK/alps.md5" "$url.md5"
          expected=$(cut -d' ' -f1 "$WORK/alps.md5")
          actual=$(md5sum "$WORK/alps.osm.pbf" | cut -d' ' -f1)
          [[ "$expected" == "$actual" ]] || { echo "::error::md5 mismatch ($expected vs $actual)"; exit 1; }
          echo "DOWNLOAD_BYTES=$(stat -c %s "$WORK/alps.osm.pbf")" >> "$GITHUB_ENV"
          # Date of the data (YYYY-MM-DD) for the export: the replication timestamp in the file header
          # (the state of the OSM data); without it the Last-Modified header of the download.
          stamp=$(osmium fileinfo -g header.option.osmosis_replication_timestamp "$WORK/alps.osm.pbf" || true)
          if [[ "$stamp" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
            source_date=${stamp:0:10}; source_from=replication-timestamp
          else
            modified=$(grep -i '^last-modified:' "$WORK/alps.headers" | tail -n 1 | cut -d' ' -f2- | tr -d '\r')
            source_date=$(date -u -d "$modified" +%F 2>/dev/null || true); source_from=last-modified
          fi
          [[ "$source_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::no data date (header: '$stamp', last-modified: '${modified:-}')"; exit 1; }
          echo "source date $source_date ($source_from)"
          echo "SOURCE_DATE=$source_date" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_FROM=$source_from" >> "$GITHUB_ENV"
          echo "DOWNLOAD_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"
          t=$SECONDS
          osmium tags-filter "$WORK/alps.osm.pbf" \
            r/route=hiking,foot,bicycle,mtb,horse,ski,piste \
            w/sac_scale w/mtb:scale w/piste:type \
            -o "$WORK/filtered.osm.pbf" --overwrite
          rm -f "${WORK:?}/alps.osm.pbf"
          echo "FILTER_SECONDS=$((SECONDS - t))" >> "$GITHUB_ENV"
          df -h /mnt

      - name: Cut to the pilot box
        run: |
          set -euo pipefail
          start=$SECONDS
          # smart: keep relations complete, routes crossing the box edge must not be cut short.
          time osmium extract --bbox "$PILOT_BBOX" --strategy smart "$WORK/filtered.osm.pbf" \
            -o "$WORK/routes.osm.pbf" --overwrite
          rm -f "${WORK:?}/filtered.osm.pbf"
          osmium fileinfo "$WORK/routes.osm.pbf" | head -n 30
          echo "CUT_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"
          echo "PBF_BYTES=$(stat -c %s "$WORK/routes.osm.pbf")" >> "$GITHUB_ENV"

      - name: Planetiler
        run: |
          set -euo pipefail
          start=$SECONDS
          mkdir -p "$WORK/tmp"
          time java -Xmx10g -jar "$JAR" \
            --osm_path="$WORK/routes.osm.pbf" \
            --output="$WORK/routes.pmtiles" \
            --tmpdir="$WORK/tmp" \
            --minzoom=6 --maxzoom=14 \
            --force 2>&1 | tee "$WORK/planetiler.log"
          echo "PLANETILER_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"
          rm -rf "${WORK:?}/tmp"
          ls -l "$WORK/routes.pmtiles"

      # Not public: the file is only uploaded to the zone; the edge script never serves /routes/.
      # Same input file as Planetiler, so relation ids match the osm_id of the tile features.
      - name: Export relations (NDJSON)
        run: |
          set -euo pipefail
          start=$SECONDS
          python3 -m venv "$WORK/venv"
          "$WORK/venv/bin/pip" install -q osmium==4.3.2
          "$WORK/venv/bin/python" -I routes/export_relations.py "$WORK/routes.osm.pbf" "$WORK/routes.ndjson.gz" \
            --source-date "$SOURCE_DATE" | tee "$WORK/export-counts.txt"
          rows=$(sed -n 's/^written=//p' "$WORK/export-counts.txt")
          [[ -n "$rows" && "$rows" -gt 0 ]] || { echo "::error::export wrote no rows"; exit 1; }
          gzip -t "$WORK/routes.ndjson.gz"
          echo "EXPORT_ROWS=$rows" >> "$GITHUB_ENV"
          echo "EXPORT_BYTES=$(stat -c %s "$WORK/routes.ndjson.gz")" >> "$GITHUB_ENV"
          echo "EXPORT_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"

      - name: Check the archive
        run: |
          set -euo pipefail
          pmtiles verify "$WORK/routes.pmtiles"
          pmtiles show "$WORK/routes.pmtiles" | tee "$WORK/show.txt"
          # Both layers must exist, otherwise the profile emitted nothing for one of them.
          pmtiles show "$WORK/routes.pmtiles" --metadata > "$WORK/metadata.json"
          for layer in route way; do
            grep -Eq "\"id\": *\"$layer\"" "$WORK/metadata.json" \
              || { echo "::error::layer $layer missing in the archive"; exit 1; }
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## Routes tiles (area: ${{ inputs.area }})"
            echo "| Step | Seconds |"
            echo "|---|---|"
            echo "| Maven build of the profile | ${BUILD_SECONDS:-n/a} |"
            echo "| Download + md5 (${DOWNLOAD_BYTES:-n/a} bytes) | ${DOWNLOAD_SECONDS:-n/a} |"
            echo "| osmium tags-filter | ${FILTER_SECONDS:-n/a} |"
            echo "| Cut to the box | ${CUT_SECONDS:-n/a} |"
            echo "| Planetiler | ${PLANETILER_SECONDS:-n/a} |"
            echo "| Relation export | ${EXPORT_SECONDS:-n/a} |"
            echo
            if [[ -n "${PBF_BYTES:-}" ]]; then echo "- Planetiler input PBF: $PBF_BYTES bytes"; fi
            if [[ -f "$WORK/routes.pmtiles" ]]; then
              echo "- Archive: $(stat -c %s "$WORK/routes.pmtiles") bytes"
              echo '```'
              pmtiles show "$WORK/routes.pmtiles" | grep -Ei 'tile|zoom|bounds|size' || true
              echo '```'
            fi
            if [[ -f "$WORK/export-counts.txt" ]]; then
              echo "- Export routes.ndjson.gz: ${EXPORT_ROWS:-n/a} rows, ${EXPORT_BYTES:-n/a} bytes, data date ${SOURCE_DATE:-n/a} (${SOURCE_DATE_FROM:-n/a})"
              echo '```'
              cat "$WORK/export-counts.txt"
              echo '```'
            fi
            if [[ -f "$WORK/planetiler.log" ]]; then
              echo '```'
              grep -E 'features|tiles|Finished|took' "$WORK/planetiler.log" | tail -n 15 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cut the Oberstdorf sample
        if: ${{ inputs.sample }}
        run: |
          set -euo pipefail
          pmtiles extract "$WORK/routes.pmtiles" "$WORK/routes-sample.pmtiles" --bbox="$SAMPLE_BBOX"
          pmtiles verify "$WORK/routes-sample.pmtiles"
          echo "- Sample (Oberstdorf): $(stat -c %s "$WORK/routes-sample.pmtiles") bytes" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.sample }}
        with:
          name: routes-sample
          path: ${{ env.WORK }}/routes-sample.pmtiles
          retention-days: 7
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.upload }}
        with:
          name: routes-pilot
          path: ${{ env.WORK }}/routes.pmtiles
          retention-days: 3
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.upload }}
        with:
          name: routes-export
          path: ${{ env.WORK }}/routes.ndjson.gz
          retention-days: 3
          compression-level: 0

      - name: Upload to Bunny storage
        if: ${{ inputs.upload }}
        env:
          AWS_ACCESS_KEY_ID: allactive-tiles-ssd
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TILES_S3_SECRET_ACCESS_KEY }}
          AREA: ${{ inputs.area }}
        run: |
          set -euo pipefail
          version=$(date -u +%Y%m%d)
          key="routes/$version/routes.pmtiles"
          aws configure set default.s3.multipart_chunksize 64MB
          aws s3 cp "$WORK/routes.pmtiles" "s3://$ZONE/$key" --endpoint-url "$S3_ENDPOINT" \
            --content-type application/vnd.pmtiles --no-progress
          remote=$(aws s3api head-object --bucket "$ZONE" --key "$key" --endpoint-url "$S3_ENDPOINT" --query ContentLength --output text)
          size=$(stat -c %s "$WORK/routes.pmtiles")
          echo "local $size, remote $remote"
          [[ "$remote" == "$size" ]] || { echo "::error::size mismatch $key"; exit 1; }
          # The export (not public) goes up first and is size checked; current.json names both of this run.
          export_key="routes/$version/routes.ndjson.gz"
          aws s3 cp "$WORK/routes.ndjson.gz" "s3://$ZONE/$export_key" --endpoint-url "$S3_ENDPOINT" \
            --content-type application/gzip --no-progress
          export_remote=$(aws s3api head-object --bucket "$ZONE" --key "$export_key" --endpoint-url "$S3_ENDPOINT" --query ContentLength --output text)
          export_size=$(stat -c %s "$WORK/routes.ndjson.gz")
          echo "export local $export_size, remote $export_remote"
          [[ "$export_remote" == "$export_size" ]] || { echo "::error::size mismatch $export_key"; exit 1; }
          python3 -c "import json, sys; json.dump({'archive': sys.argv[1], 'bytes': int(sys.argv[2]), 'built': sys.argv[3], 'run': int(sys.argv[4]), 'area': sys.argv[5], 'export': {'key': sys.argv[6], 'bytes': int(sys.argv[7]), 'rows': int(sys.argv[8])}}, open('/tmp/current.json', 'w'))" \
            "$key" "$size" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.run_id }}" "$AREA" "$export_key" "$export_size" "$EXPORT_ROWS"
          aws s3 cp /tmp/current.json "s3://$ZONE/routes/current.json" --endpoint-url "$S3_ENDPOINT" \
            --content-type application/json --cache-control no-cache --no-progress
          cat /tmp/current.json
          echo "- Uploaded \`$key\` ($size bytes) and \`$export_key\` ($export_size bytes, $EXPORT_ROWS rows), \`routes/current.json\` updated" >> "$GITHUB_STEP_SUMMARY"
          # Keep the newest three archives; never the one just written.
          aws s3api list-objects-v2 --bucket "$ZONE" --prefix routes/ --endpoint-url "$S3_ENDPOINT" \
            --query 'Contents[].Key' --output text | tr '\t' '\n' \
            | grep -E '^routes/[0-9]{8}/routes\.pmtiles$' | sort | head -n -3 | while read -r old; do
              [[ -z "$old" || "$old" == "$key" ]] && continue
              echo "deleting $old"
              aws s3 rm "s3://$ZONE/$old" --endpoint-url "$S3_ENDPOINT"
            done
          # Same for the exports: keep the newest three, never the one just written.
          aws s3api list-objects-v2 --bucket "$ZONE" --prefix routes/ --endpoint-url "$S3_ENDPOINT" \
            --query 'Contents[].Key' --output text | tr '\t' '\n' \
            | grep -E '^routes/[0-9]{8}/routes\.ndjson\.gz$' | sort | head -n -3 | while read -r old; do
              [[ -z "$old" || "$old" == "$export_key" ]] && continue
              echo "deleting $old"
              aws s3 rm "s3://$ZONE/$old" --endpoint-url "$S3_ENDPOINT"
            done
